name: 🔥 Viral Finder — Roda 2x por semana

on:
  schedule:
    - cron: "0 11 * * 2"   # Terça 08h BRT
    - cron: "0 11 * * 5"   # Sexta  08h BRT
  workflow_dispatch:        # Roda manual com 1 clique

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: roda o script e faz upload do artefato Pages ──────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🚀 Rodar Viral Finder
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 📤 Commit relatório no repositório
        run: |
          git config user.name  "Viral Finder Bot"
          git config user.email "bot@viral-finder.local"
          git add reports/
          git diff --cached --quiet || git commit -m "🔥 Relatório $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Empacotar relatório para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  # ── Job 2: publica no GitHub Pages ───────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
