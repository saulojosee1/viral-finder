name: 🔥 Viral Finder — Roda 2x por semana

on:
  schedule:
    # Toda terça às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * 2"
    # Toda sexta às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * 5"
  # Permite rodar manualmente no GitHub com 1 clique
  workflow_dispatch:

permissions:
  contents: write  # para fazer commit do relatório
  pages: write     # para publicar no GitHub Pages
  id-token: write

jobs:
  run-viral-finder:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🚀 Rodar Viral Finder
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 📤 Commit e push do relatório
        run: |
          git config --global user.name "Viral Finder Bot"
          git config --global user.email "bot@viral-finder.local"
          git add reports/
          git diff --cached --quiet || git commit -m "🔥 Relatório $(date +'%Y-%m-%d %H:%M UTC')"
          git push

  deploy-pages:
    needs: run-viral-finder
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout atualizado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: 🚀 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
